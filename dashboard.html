<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CMS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f4f6f9;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #004ecb);
            position: fixed;
            left: 0;
            top: 0;
            color: white;
            padding: 25px;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .sidebar h2 {
            font-weight: 700;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .sidebar a:hover,
        .sidebar a.active-link {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(6px);
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            padding: 30px;
        }

        /* TOPBAR */
        .topbar {
            background: white;
            padding: 18px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        /* CARDS */
        .card-box {
            border: none;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .card-box:hover {
            transform: translateY(-8px);
        }

        /* RESPONSIVE */
        @media(max-width:768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                text-align: center;
                padding: 20px;
            }

            .sidebar a:hover,
            .sidebar a.active-link {
                transform: none;
            }

            .main {
                margin-left: 0;
                padding: 20px 15px;
            }
        }
    </style>

</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2><i class="fas fa-shield-alt me-2"></i>CMS</h2>

        <a href="dashboard.html" class="active-link"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="index.html"><i class="fas fa-globe me-2"></i> Home</a>
        <a href="submitcomplaint.html"><i class="fas fa-plus-circle me-2"></i> Submit Complaint</a>
        <a href="mycomplaints.html"><i class="fas fa-list me-2"></i> My Complaints</a>
        <a href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar d-flex justify-content-between align-items-center">
            <div>
                <h3 class="m-0 fw-bold">Dashboard Overview</h3>
                <small class="text-muted" id="welcomeUser">Welcome to Complaint Management System</small>
            </div>
            <div>
                <a href="submitcomplaint.html" class="btn btn-primary fw-bold">
                    <i class="fas fa-plus me-1"></i> New Complaint
                </a>
            </div>
        </div>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card card-box p-4 text-center">
                    <i class="fas fa-file-alt fs-1 text-primary mb-3"></i>
                    <h5 class="text-muted">Total Complaints</h5>
                    <h2 class="fw-bold text-dark" id="totalCount">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-box p-4 text-center">
                    <i class="fas fa-check-circle fs-1 text-success mb-3"></i>
                    <h5 class="text-muted">Resolved</h5>
                    <h2 class="fw-bold text-dark" id="resolvedCount">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-box p-4 text-center">
                    <i class="fas fa-clock fs-1 text-warning mb-3"></i>
                    <h5 class="text-muted">Pending</h5>
                    <h2 class="fw-bold text-dark" id="pendingCount">0</h2>
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DYNAMIC SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Fetch User Details
            const currentUser = JSON.parse(localStorage.getItem("currentUser"));
            if (currentUser && currentUser.email) {
                document.getElementById("welcomeUser").innerText = "Welcome back, " + currentUser.email;
            }

            // Fetch Complaints Data
            const complaints = JSON.parse(localStorage.getItem("complaints")) || [];

            const total = complaints.length;
            const resolved = complaints.filter(c => c.status === "Resolved").length;
            const pending = complaints.filter(c => c.status === "Pending" || !c.status).length;

            document.getElementById("totalCount").innerText = total;
            document.getElementById("resolvedCount").innerText = resolved;
            document.getElementById("pendingCount").innerText = pending;
        });

        function logoutUser() {
            localStorage.removeItem("currentUser");
            window.location.href = "login.html";
        }
    </script>

</body>

</html>

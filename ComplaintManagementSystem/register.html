<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CMS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0d6efd, #004ecb, #6a11cb, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            padding: 30px 20px;
        }

        /* BACKGROUND ANIMATION */
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* REGISTER BOX */
        .register-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
        }

        /* TITLE */
        .register-box h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
        }

        /* INPUT */
        .form-control {
            padding: 10px 14px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 12px rgba(13, 110, 253, 0.3);
        }

        /* BUTTON */
        .btn-primary {
            width: 100%;
            padding: 10px;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #004ecb;
            transform: scale(1.02);
        }

        /* LINK */
        .register-box a {
            text-decoration: none;
            font-weight: 500;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 15px;
            color: #6c757d;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .back-home:hover {
            color: #0d6efd;
        }

        .toggle-password {
            cursor: pointer;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>

<body>

    <div class="register-box">

        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left me-1"></i> Back to Home
        </a>

        <h2><i class="fas fa-user-plus me-2"></i>Create Account</h2>

        <form onsubmit="return registerUser(event)">

            <div class="mb-3">
                <label for="fullname" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" id="fullname" class="form-control" placeholder="Enter full name" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Create password"
                        minlength="6" required>
                    <span class="input-group-text toggle-password" onclick="toggleVisibility('password', 'eyeIcon1')">
                        <i class="fas fa-eye text-muted" id="eyeIcon1"></i>
                    </span>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password"
                        required>
                    <span class="input-group-text toggle-password"
                        onclick="toggleVisibility('confirmPassword', 'eyeIcon2')">
                        <i class="fas fa-eye text-muted" id="eyeIcon2"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-2">Register</button>

            <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="login.html" class="fw-bold">Login</a>
            </p>

        </form>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function registerUser(event) {
            if (event) event.preventDefault();

            const name = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return false;
            }

            let users = JSON.parse(localStorage.getItem("cms_users")) || [];

            // Check if user already exists
            const userExists = users.some(u => u.email === email);
            if (userExists) {
                alert("An account with this email already exists!");
                return false;
            }

            // Save new user data
            const newUser = {
                name: name,
                email: email,
                password: password,
                createdAt: new Date().toLocaleDateString()
            };

            users.push(newUser);
            localStorage.setItem("cms_users", JSON.stringify(users));

            alert("Registration Successful! Please Login.");
            window.location.href = "login.html";
            return false;
        }

        function toggleVisibility(inputId, eyeId) {
            const inputField = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeId);

            if (inputField.type === "password") {
                inputField.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                inputField.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>

</body>

</html>
